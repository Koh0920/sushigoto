schema_version = "1"
name = "sushigoto"
version = "1.0.0"

[tools]
python = "3.12"

[run]
command = ["python3", "server.py"]

[web]
port = 8080
bind = "0.0.0.0"

[seal_at]
command = ["python3", "-c", 'import json,urllib.request; state=json.load(urllib.request.urlopen("http://172.16.0.2:8080/__ato/state",timeout=5)); assert state=={"app":"sushigoto","upstream_commit":"56c577941a41cd8826bd73d3120dbc524c1d9d3e","demo_tasks":3,"primary_screen":"action","external_integrations":False,"runtime_downloads":False}']
timeout_seconds = 30
